<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026ドラフト 30秒自動テスト</title><style>body{font-family:-apple-system,sans-serif;background:#101b2d;color:#f4f6ff;margin:0;padding:14px}h1{font-size:21px}button{padding:12px;border:0;border-radius:9px;background:#337ce2;color:white;font-weight:700;margin:4px}button:disabled{opacity:.4}.panel{background:#1d304d;border-radius:12px;padding:12px;margin:12px 0}.stats{display:flex;gap:8px}.stats>div{flex:1;text-align:center;background:#233d60;padding:10px;border-radius:10px}.scroll{overflow-x:auto}table{border-collapse:collapse;font-size:12px}td,th{border:1px solid #3e5474;padding:8px;min-width:85px}th{background:#253e60}td:first-child,th:first-child{position:sticky;left:0;background:#253e60;min-width:46px}td:nth-child(2),th:nth-child(2){background:#553044}.log{max-height:240px;overflow:auto}.log div{border-bottom:1px solid #40516a;padding:6px}.small{color:#bdc9db;font-size:12px}.badge{color:#ffdc8e}.pos-infielder{background:#f8e58a!important;color:#382c00!important}.pos-outfielder{background:#b5e9b1!important;color:#173e20!important}.pos-catcher{background:#a9e7f6!important;color:#123c50!important}.pos-pitcher{background:#ffdab2!important;color:#533319!important}.pos-unknown{background:#344963!important;color:#e7f0ff!important}.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.legend span{border-radius:5px;padding:5px 9px;font-size:12px}</style></head><body><h1>⚾ ドラフト30秒自動テスト</h1><div class="small">架空の指名です。実際のドラフト速報とは無関係です。Safariでこのページを開いたままにしてください。</div><div class="panel"><div class="stats"><div><b id="count">0</b><div class="small">確定指名</div></div><div><b id="left">72</b><div class="small">未指名</div></div><div><b id="tick">30</b><div class="small">次のイベントまで秒</div></div></div><p id="phase" class="badge">待機中</p><button id="start" onclick="start()">▶ 30秒間隔で開始</button><button onclick="pause()">一時停止</button><button onclick="advance()">次のイベントを今すぐ実行</button><button onclick="reset()">初期化</button></div><div class="legend"><span class="pos-infielder">内野手</span><span class="pos-outfielder">外野手</span><span class="pos-catcher">捕手</span><span class="pos-pitcher">投手</span><span class="pos-unknown">未分類</span></div><div class="panel"><b>12球団指名表</b><p class="small">横：ウェーバー順。1位入札・外れ1位・外れ外れ1位・外れ外れ外れ1位・1位確定を別行で表示。2位は左→右、3位は右→左。</p><div class="scroll"><table id="board"></table></div></div><div class="panel"><b>入札・抽選・指名イベント履歴</b><div id="events" class="log"></div></div><div class="panel"><b>未指名ランキング</b><div id="rank"></div></div><script>
const teams=['楽天','中日','ロッテ','ヤクルト','オリックス','広島','日本ハム','DeNA','西武','巨人','ソフトバンク','阪神'];let candidates=[],events=[],picks=[],bids=[],pointer=0,timer=null,seconds=30;
// First round deliberately contains overlapping bids, then deterministic simulated lottery outcomes.
const positions={
 '鈴木泰成':'投手','菰田陽生':'投手','渡部海':'捕手','織田翔希':'投手','宮原廉':'内野手','米沢友翔':'投手','藤澤涼介':'外野手','前田侑大':'投手','榊原七斗':'投手','渡辺和大':'投手','沢山優介':'投手','角田楓斗':'投手','有馬伽久':'投手','杉本真滉':'投手','末吉良丞':'投手','平田玲翔':'投手','保西雅則':'投手','川尻啓人':'投手','馬場拓海':'投手','星野世那':'投手','前嶋藍':'捕手','西野啓':'内野手','山里宝':'内野手','岡田啓吾':'内野手','新城楓雅':'投手','池田聖摩':'内野手','小金井凌生':'投手','猪俣駿太':'投手','吉川湊平':'投手','仲井慎':'投手','常深颯大':'投手','伊藤権人':'投手','黒田義信':'外野手','春山陽登':'外野手','長屋竣大':'投手','柴崎聖人':'外野手','丹羽涼介':'投手','田中諒':'投手','高田瑛大':'投手','松平快聖':'投手','野村亮輔':'投手','的場吏玖':'投手','福原聖矢':'捕手','佐藤悠太':'外野手','柿本晟弥':'投手','樋口新':'投手','相羽寛太':'内野手','中津大和':'内野手','近藤琉唯斗':'投手','鈴木悠悟':'投手','川島謙心':'投手','岡本翔斗':'投手','内藤蒼':'投手','福島陽奈汰':'投手','光弘帆高':'内野手','磯貝和賢':'投手','樫村佳歩':'捕手','川原嗣貴':'投手','藤井基':'投手','杉崎成':'内野手','田山輝':'捕手','田中皐晴':'投手','生盛亜勇太':'投手','伊藤愛希':'投手','赤堀颯':'内野手','今津慶介':'投手','清水智裕':'捕手','松浦佑星':'内野手','山田虎太郎':'投手','小松勇輝':'内野手','三浦遼大':'投手','川口真也':'投手'};
const posClass=n=>({'内野手':'pos-infielder','外野手':'pos-outfielder','捕手':'pos-catcher','投手':'pos-pitcher'}[positions[n]]||'pos-unknown');
const firstBids=[['楽天','広島','巨人'],['中日','ロッテ'],['ヤクルト','阪神'],['オリックス'],['日本ハム'],['DeNA'],['西武'],['ソフトバンク']];
const firstNames=[2,0,1,3,4,5,6,7]; // 0-based ranks: Watanabe, Suzuki, Komoda, etc.
const winners=['楽天','中日','阪神','オリックス','日本ハム','DeNA','西武','ソフトバンク'];
function plan(){
 const out=[];
 // 1st ballot: every club submits one bid; deliberate overlaps.
 const first=[
 ['楽天',2],['中日',0],['ロッテ',0],['ヤクルト',1],
 ['オリックス',3],['広島',2],['日本ハム',4],['DeNA',5],
 ['西武',6],['巨人',2],['ソフトバンク',7],['阪神',1]
 ];
 for(const [team,idx] of first)out.push({type:'bid',stage:1,team,name:candidates[idx].name,label:`1位入札：${team} → ${candidates[idx].name}`});
 const groups={};for(const [t,idx] of first){const n=candidates[idx].name;(groups[n]??=[]).push(t)}
 const winnerMap={'渡部海':'楽天','鈴木泰成':'中日','菰田陽生':'阪神'};
 const winners=[];
 for(const [name,ts] of Object.entries(groups)){
  const winner=winnerMap[name]||ts[0];winners.push(winner);
  out.push({type:'award',stage:1,team:winner,round:1,name,label:ts.length>1?`1位抽選：${name}（${ts.length}球団競合）→ ${winner}当選`:`1位単独：${winner} → ${name}`});
 }
 let next=8;
 // Force a three-way fallback contest, then a two-way third ballot, then a fourth ballot.
 let missing=teams.filter(t=>!winners.includes(t));
 const stage2Contenders=missing.slice(0,3);
 if(stage2Contenders.length===3){
  const c=candidates[next++];
  for(const t of stage2Contenders)out.push({type:'bid',stage:2,team:t,name:c.name,label:`外れ1位入札：${t} → ${c.name}`});
  const win=stage2Contenders[0];
  out.push({type:'award',stage:2,team:win,round:1,name:c.name,label:`外れ1位抽選：${c.name}（3球団競合）→ ${win}当選`});
  missing=missing.filter(t=>t!==win);
 }
 // Fourth unconfirmed team receives an uncontested fallback pick.
 for(const t of missing.filter(t=>!stage2Contenders.includes(t))){
  const c=candidates[next++];if(!c)break;
  out.push({type:'bid',stage:2,team:t,name:c.name,label:`外れ1位入札：${t} → ${c.name}`});
  out.push({type:'award',stage:2,team:t,round:1,name:c.name,label:`外れ1位確定：${t} → ${c.name}`});
 }
 const third=missing.filter(t=>stage2Contenders.includes(t));
 if(third.length===2){
  const c=candidates[next++];
  for(const t of third)out.push({type:'bid',stage:3,team:t,name:c.name,label:`外れ外れ1位入札：${t} → ${c.name}`});
  out.push({type:'award',stage:3,team:third[0],round:1,name:c.name,label:`外れ外れ1位抽選：${c.name}（2球団競合）→ ${third[0]}当選`});
  const c4=candidates[next++];
  out.push({type:'bid',stage:4,team:third[1],name:c4.name,label:`外れ外れ外れ1位入札：${third[1]} → ${c4.name}`});
  out.push({type:'award',stage:4,team:third[1],round:1,name:c4.name,label:`外れ外れ外れ1位確定：${third[1]} → ${c4.name}`});
 }
 for(let round=2;round<=12;round++){
  const arr=round%2===0?teams:[...teams].reverse();
  for(const team of arr){const c=candidates[next++];if(!c)return out;out.push({type:'award',team,round,name:c.name,label:`${round}位：${team} → ${c.name}`})}
 }
 return out;
}
let schedule=[];
function render(){document.getElementById('count').textContent=picks.length;document.getElementById('left').textContent=72-picks.length;document.getElementById('tick').textContent=seconds;document.getElementById('phase').textContent=pointer>=schedule.length?'全72選手の指名完了':`次のイベント ${pointer+1}/${schedule.length}：${schedule[pointer]?.label||'準備中'}`;let h='<tr><th>順位</th>'+teams.map((t,i)=>`<th>${i+1}番<br>${t}</th>`).join('')+'</tr>';
 const stages=[...new Set([1,...bids.map(x=>x.stage)])].sort((a,b)=>a-b).map(stage=>({stage,label:stage===1?'1位入札':stage===2?'外れ1位入札':stage===3?'外れ外れ1位入札':stage===4?'外れ外れ外れ1位入札':`外れ${stage-1}回目1位入札`}));
 for(const st of stages){
  if(st.stage>1&&!bids.some(x=>x.stage===st.stage))continue;
  h+=`<tr><td>${st.label}</td>`;
  for(const t of teams){const b=bids.find(x=>x.stage===st.stage&&x.team===t);const awarded=b&&picks.some(x=>x.team===t&&x.name===b.name&&x.round===1);h+=`<td class="${b?posClass(b.name):''}">${b?`${b.name}<br><span class="small">${awarded?'当選・確定':'入札'}</span>`:'—'}</td>`}
  h+='</tr>';
 }
 for(let r=1;r<=12;r++){
  h+=`<tr><td>${r===1?'1位確定':r+'位'}</td>`;
  for(const t of teams){const p=picks.find(x=>x.team===t&&x.round===r);h+=`<td class="${p?posClass(p.name):''}">${p?p.name:'—'}</td>`}
  h+='</tr>';
 }
 document.getElementById('board').innerHTML=h;document.getElementById('events').innerHTML=events.slice().reverse().map(x=>`<div>${x}</div>`).join('');document.getElementById('rank').innerHTML=candidates.filter(c=>!picks.some(p=>p.name===c.name)).map(c=>`<div class="${posClass(c.name)}" style="padding:7px;margin:3px 0;border-radius:5px">${c.rank}位　${c.name} <span class="small">${c.school}</span></div>`).join('')||'候補者全員が指名済み'}
function advance(){if(!schedule.length||pointer>=schedule.length){pause();return}const e=schedule[pointer++];events.push(`${pointer}. ${e.label}`);if(e.type==='bid')bids.push(e);if(e.type==='award'){if(!picks.some(p=>p.name===e.name))picks.push(e)}seconds=30;render();if(pointer>=schedule.length)pause()}
function start(){if(timer||!schedule.length)return;timer=setInterval(()=>{seconds--;if(seconds<=0)advance();else document.getElementById('tick').textContent=seconds},1000);document.getElementById('start').disabled=true}
function pause(){clearInterval(timer);timer=null;document.getElementById('start').disabled=false}
function reset(){pause();events=[];picks=[];bids=[];pointer=0;seconds=30;render()}
fetch('./candidates.json').then(r=>r.json()).then(a=>{candidates=a;schedule=plan();render()}).catch(()=>{document.getElementById('phase').textContent='読み込み失敗：GitHub Pages上のURLで開いてください'});
</script></body></html>
